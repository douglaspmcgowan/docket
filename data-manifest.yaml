version: 2
project: "docket"
data_root_env: "PROJECT_DATA_ROOT"
local_root_env: "LOCAL_STORE_DIR"
local_root_default: "%USERPROFILE%\\.docket-local"
sync_root_env: "PROJECT_DATA_SYNC_ROOT"
sync_adapter: ".agents/data/Sync-ProjectData.ps1"
assets:
  - name: "local-card-store"
    relative_path: "docket.sqlite3"
    format: "SQLite with current and previous JSON exports"
    source: "Docket local-server and sync clients"
    sensitivity: "private"
    version: "runtime"
    checksum: "SHA-256 sidecar for every Google Drive snapshot"
    regenerate: "run .agents/data/Sync-ProjectData.ps1 -Action Restore"
  - name: "generated-card-outbox"
    relative_path: "inputs/outbox"
    format: "JSON"
    source: "project audit and brief generators"
    sensitivity: "mixed; classify every card before routing"
    version: "content-derived stable card IDs"
    checksum: "per-file SHA-256 when archived"
    regenerate: "rerun the source project card generator"
  - name: "results-export"
    relative_path: "outputs/results"
    format: "JSON"
    source: "Docket submit and pull flow"
    sensitivity: "private"
    version: "append or export timestamp"
    checksum: "snapshot manifest"
    regenerate: "pull from the authorized board while results remain retained"
